 for(let v=.5;v<=2;v+=.5){const y=yb-v/2*290;c.beginPath();c.moveTo(x0,y);c.lineTo(x0+14,y);c.stroke();txt(v+' L',x0-8,y+4,'#555','right','700 12px Cairo')}
 const nX=Math.round(s.a*p.n*50),nY=Math.round(s.b*p.n*50);
 pool.slice(0,nX).forEach(q=>sph(x0+12+q[0]*(w-24)+Math.sin(t+q[2])*4,yb-8-q[1]*(h-16)+Math.cos(t*.8+q[2])*4,6,NA));
 pool.slice(180,180+nY).forEach(q=>sph(x0+12+q[0]*(w-24)+Math.sin(t*.9+q[2])*4,yb-8-q[1]*(h-16)+Math.cos(t+q[2])*4,8,CL));
 sph(560,100,7,NA);txt(s.X+' (×'+s.a+')',575,105,'#111','left');sph(560,130,9,CL);txt(s.Y+' (×'+s.b+')',575,135,'#111','left');txt('C = '+(p.n/p.V).toFixed(3)+' mol/L',340,40,'#111','center','900 18px Cairo')}
// ---------- UI
function build(){const s=S[cur];$('#stt').textContent=T(s.n);$('#inf').textContent=T(s.info);
 $('#sls').innerHTML=s.par.map(q=>q.chk?`<div class="sl"><label><input type="checkbox" data-k="${q.k}" ${V[q.k]?'checked':''}> ${T(q.lab)}</label></div>`:q.sel?`<div class="sl"><label>${T(q.lab)}</label><select data-k="${q.k}">${q.sel.map(o=>`<option ${o==V[q.k]?'selected':''}>${o}</option>`).join('')}</select></div>`:`<div class="sl"><label>${T(q.lab)}</label><span id="v_${q.k}">${V[q.k]} ${q.u}</span><input type="range" min="${q.min}" max="${q.max}" step="${q.st}" value="${V[q.k]}" data-k="${q.k}"></div>`).join('');
 document.querySelectorAll('#sls [data-k]').forEach(i=>i.oninput=()=>{const q=s.par.find(z=>z.k==i.dataset.k);V[q.k]=q.chk?+i.checked:q.sel?i.value:+i.value;const l=$('#v_'+q.k);if(l)l.textContent=V[q.k]+' '+q.u});
 $('#tabs').innerHTML=S.map((_,i)=>`<button class="tab ${i==cur?'on':''}" onclick="pick(${i})">${i+1}</button>`).join(' ')}
function pick(i){cur=i;V={};S[i].par.forEach(q=>V[q.k]=q.v);build()}

$('#bl').onclick=()=>setLang(lang=='fr'?'ar':'fr');
let last=0;(function loop(ts){const dt=Math.min((ts-last)/1000,.05);last=ts;if(!rm)t+=dt;const s=S[cur];c.clearRect(0,0,680,420);s.draw(V,t);
 $('#scr').innerHTML=s.res(V).map(([a,b,k])=>`<div class="${k}"><span>${a}</span><span>${b}</span></div>`).join('');$('#fm').innerHTML=s.fm(V);requestAnimationFrame(loop)})(0);
